# Secret scanning with Gitleaks.
#
# Runs the full-history scan from .gitleaks.toml on every PR/push plus a
# weekly scheduled sweep. Pre-commit (gitleaks hook) and `bun run
# secrets:scan` cover the local side; this workflow is the server-side
# backstop so a secret can never land via a client without the hook.
#
# NOTE (org license): frontal-labs is a GitHub organization, and
# gitleaks-action requires a free license for org-owned repos
# (https://gitleaks.io). Provision it once as a repository secret named
# GITLEAKS_LICENSE; personal forks work without it.
name: Gitleaks

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # Weekly full-history sweep, Monday 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with the local toolchain (CONTRIBUTING.md) and the
  # pre-commit hook rev so local and CI scans use identical rules.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: ${{ env.GITLEAKS_VERSION }}
