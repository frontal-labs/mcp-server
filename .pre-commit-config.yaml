# Install with: pre-commit install (wired via the package.json `prepare` script).
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
        # Vendored k8s-manifest-generator assets are intentional
        # multi-document templates for `kubectl apply`, which the
        # single-document check-yaml hook cannot validate.
        exclude: ^skills/k8s-manifest-generator/assets/
      - id: check-json
      - id: check-added-large-files
      - id: debug-statements
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-toml
      - id: check-xml
      # NOTE: no pretty-format-json here. Biome (via ultracite) owns JSON
      # formatting, and the two disagree — pretty-format-json expands arrays
      # one item per line while Biome collapses them that fit. Running both
      # made `bun run check` and `git commit` reformat the same files back
      # and forth forever. `check-json` above still validates syntax.
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
  # Local hooks mirror the checks husky enforced (biome, type-check, test,
  # commitlint) so parity is preserved after the migration.
  # The gitleaks hook is new (no husky predecessor): it scans staged changes
  # for secrets and blocks the commit on a finding. Requires the gitleaks
  # binary (>= 8.30): `brew install gitleaks`. Policy: .gitleaks.toml.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged secret scan)
        entry: gitleaks git --pre-commit --redact --staged --verbose --config .gitleaks.toml
        language: system
        pass_filenames: false
      - id: biome
        name: biome check (lint + format)
        entry: bunx biome check src/ tests/ e2e/
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: type-check
        name: type-check
        entry: bun run type-check
        language: system
        files: \.ts$
        pass_filenames: false
      - id: test
        name: test
        entry: bun run test
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
      - id: commitlint
        name: commitlint
        entry: bunx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: false
