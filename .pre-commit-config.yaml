# Install with: pre-commit install (wired via the package.json `prepare` script).
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: debug-statements
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-toml
      - id: check-xml
      # NOTE: no pretty-format-json here. Biome (via ultracite) owns JSON
      # formatting, and the two disagree — pretty-format-json expands arrays
      # one item per line while Biome collapses them that fit. Running both
      # made `bun run check` and `git commit` reformat the same files back
      # and forth forever. `check-json` above still validates syntax.
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
  # Local hooks mirror the checks husky enforced (biome, type-check, test,
  # commitlint) so parity is preserved after the migration.
  - repo: local
    hooks:
      - id: biome
        name: biome check (lint + format)
        entry: bunx biome check src/ tests/
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: type-check
        name: type-check
        entry: bun run type-check
        language: system
        files: \.ts$
        pass_filenames: false
      - id: test
        name: test
        entry: bun run test
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
      - id: commitlint
        name: commitlint
        entry: bunx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: false
